name: Autodarts Liga – Cloud-Veröffentlichung (Liga-Dashboard 0.11.2)

on:
  workflow_dispatch:
  schedule:
    # Alle 5 Minuten, leicht versetzt zum Stundenbeginn.
    - cron: '2-59/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: autodarts-liga-pages
  cancel-in-progress: false

jobs:
  publish:
    name: OneDrive lesen → Liga bauen → Webseite veröffentlichen
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.LIGA_PUBLISH_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Rclone installieren
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://downloads.rclone.org/rclone-current-linux-amd64.zip -o "$RUNNER_TEMP/rclone.zip"
          rm -rf "$RUNNER_TEMP/rclone-extract" "$RUNNER_TEMP/rclone-bin"
          mkdir -p "$RUNNER_TEMP/rclone-extract" "$RUNNER_TEMP/rclone-bin"
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone-extract"
          find "$RUNNER_TEMP/rclone-extract" -type f -name rclone -exec cp {} "$RUNNER_TEMP/rclone-bin/rclone" \;
          test -s "$RUNNER_TEMP/rclone-bin/rclone"
          chmod +x "$RUNNER_TEMP/rclone-bin/rclone"
          echo "$RUNNER_TEMP/rclone-bin" >> "$GITHUB_PATH"

      - name: OneDrive vollständig lesen und Liga mit Liga-Dashboard 0.11.2 bauen
        shell: bash
        env:
          LIGA_RCLONE_CONFIG_B64: ${{ secrets.LIGA_RCLONE_CONFIG_B64 }}
          LIGA_ONEDRIVE_ORDNER: ${{ vars.LIGA_ONEDRIVE_ORDNER || 'Autodarts Liga' }}
        run: bash cloud/scripts/build-site.sh

      - name: Neu erzeugte Webseite zwingend prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/build-info.json
          grep -q 'AUTODARTS LIGA' site/index.html
          grep -q 'Finalspieltag' site/index.html
          grep -q 'Saison-Awards' site/index.html
          grep -Eq 'LIVE · aktueller Stand|ENDSTAND · reguläre Saison' site/index.html
          grep -q 'id="spielplan"' site/index.html
          grep -q 'Hall of Fame' site/index.html
          grep -q 'Head-to-Head' site/index.html
          grep -q 'Rekordbuch' site/index.html
          grep -q 'Spielerprofile' site/index.html
          grep -q 'data-tab="spielplan"' site/index.html
          grep -q 'data-tab="statistiken"' site/index.html
          grep -q 'data-tab="historie"' site/index.html
          grep -q 'data-tab="finale"' site/index.html
          if grep -q 'System-Gesundheit' site/index.html; then echo 'FEHLER: Systemgesundheit darf nicht auf der Homepage sichtbar sein.' >&2; exit 4; fi
          echo 'OK: Das aktuelle OneDrive-Build-Artefakt mit kompaktem Liga-Dashboard, Spielplan, Live-Awards und Finalspieltag liegt vollständig vor.'
          cat site/build-info.json

      - name: Prüf-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: liga-html-test
          path: site/
          retention-days: 2

      - name: GitHub Pages vorbereiten
        if: vars.LIGA_PUBLISH_ENABLED == 'true'
        uses: actions/configure-pages@v5

      - name: Exakt dieses Build als Pages-Artefakt hochladen
        if: vars.LIGA_PUBLISH_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Webseite erst nach erfolgreichem OneDrive-Build veröffentlichen
        if: vars.LIGA_PUBLISH_ENABLED == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
